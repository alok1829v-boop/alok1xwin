<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alok1xwin - Aviator Crash Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0e0e10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            max-width: 600px;
            background: #1b1c1d;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2c2d30;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #e50914;
            letter-spacing: 1px;
        }
        .logo span {
            color: #ffffff;
        }
        .balance-box {
            background: #26282b;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            color: #28a745;
            border: 1px solid #3a3d42;
        }
        .history-bar {
            width: 100%;
            max-width: 600px;
            background: #141516;
            padding: 8px 15px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 1px solid #222;
        }
        .badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            background: #26282b;
        }
        .badge.low { color: #3498db; }
        .badge.mid { color: #9b59b6; }
        .badge.high { color: #e91e63; }
        .game-container {
            width: 95%;
            max-width: 580px;
            height: 280px;
            background: radial-gradient(circle at bottom left, #3a0ca3 0%, #141516 70%);
            margin-top: 15px;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            border: 1px solid #2c2d30;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .multiplier-display {
            position: relative;
            z-index: 10;
            font-size: 54px;
            font-weight: 800;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .status-text {
            position: relative;
            z-index: 10;
            font-size: 16px;
            margin-top: 5px;
            font-weight: 600;
            color: #f39c12;
        }
        .crashed {
            color: #e50914 !important;
        }
        .controls-box {
            width: 95%;
            max-width: 580px;
            background: #1b1c1d;
            margin-top: 15px;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #2c2d30;
        }
        .bet-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .bet-input-wrapper {
            display: flex;
            align-items: center;
            background: #0e0e10;
            border: 1px solid #3a3d42;
            border-radius: 10px;
            padding: 5px 10px;
        }
        .bet-input-wrapper button {
            background: #2c2d30;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        .bet-input-wrapper input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            outline: none;
        }
        .quick-bets {
            display: flex;
            gap: 6px;
        }
        .quick-bets button {
            flex: 1;
            background: #26282b;
            border: 1px solid #3a3d42;
            color: #ccc;
            padding: 5px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .quick-bets button:hover {
            background: #3a3d42;
            color: white;
        }
        .action-btn {
            flex: 1.2;
            height: 75px;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .btn-bet { background: #28a745; }
        .btn-bet:hover { background: #218838; }
        .btn-cancel { background: #dc3545; }
        .btn-cashout { background: #f39c12; color: #000; }
        .btn-disabled { background: #444; cursor: not-allowed; opacity: 0.7; }
        .notification {
            margin-top: 15px;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            text-align: center;
            width: 95%;
            max-width: 580px;
        }
        .notif-win { background: rgba(40, 167, 69, 0.2); border: 1px solid #28a745; color: #28a745; }
    </style>
</head>
<body>

    <header>
        <div class="logo">ALOK<span>1XWIN</span></div>
        <div class="balance-box">🪙 <span id="balance">1000.00</span></div>
    </header>

    <div class="history-bar" id="historyBar">
        <span class="badge mid">2.45x</span>
        <span class="badge low">1.12x</span>
        <span class="badge high">12.80x</span>
        <span class="badge low">1.40x</span>
        <span class="badge mid">3.15x</span>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="multiplier-display" id="multiplier">1.00x</div>
        <div class="status-text" id="statusText">अगले राउंड के लिए बेट लगाएं...</div>
    </div>

    <div id="winNotif" class="notification notif-win"></div>

    <div class="controls-box">
        <div class="bet-row">
            <div class="input-group">
                <div class="bet-input-wrapper">
                    <button onclick="adjustBet(-10)">-</button>
                    <input type="number" id="betAmount" value="50" min="10">
                    <button onclick="adjustBet(10)">+</button>
                </div>
                <div class="quick-bets">
                    <button onclick="setBet(50)">50</button>
                    <button onclick="setBet(100)">100</button>
                    <button onclick="setBet(500)">500</button>
                </div>
            </div>
            <button id="actionBtn" class="action-btn btn-bet" onclick="handleAction()">BET</button>
        </div>
    </div>

    <script>
        let balance = 1000.00;
        let currentMultiplier = 1.00;
        let crashPoint = 1.00;
        let gameState = 'WAITING';
        let hasBet = false;
        let cashedOut = false;
        let currentBet = 0;
        let animFrame;
        let startTime;

        const balanceEl = document.getElementById('balance');
        const multEl = document.getElementById('multiplier');
        const statusEl = document.getElementById('statusText');
        const actionBtn = document.getElementById('actionBtn');
        const betInput = document.getElementById('betAmount');
        const historyBar = document.getElementById('historyBar');
        const winNotif = document.getElementById('winNotif');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function adjustBet(val) {
            if (hasBet) return;
            let current = parseFloat(betInput.value) || 10;
            if (current + val >= 10) betInput.value = current + val;
        }

        function setBet(val) {
            if (hasBet) return;
            betInput.value = val;
        }

        function handleAction() {
            if (gameState === 'WAITING') {
                if (!hasBet) {
                    let amount = parseFloat(betInput.value);
                    if (isNaN(amount) || amount < 10 || amount > balance) {
                        alert("सही राशि डालें या बैलेंस चेक करें!");
                        return;
                    }
                    balance -= amount;
                    currentBet = amount;
                    hasBet = true;
                    updateUI();
                } else {
                    balance += currentBet;
                    hasBet = false;
                    currentBet = 0;
                    updateUI();
                }
            } else if (gameState === 'FLYING' && hasBet && !cashedOut) {
                cashedOut = true;
                let winAmount = currentBet * currentMultiplier;
                balance += winAmount;
                showNotification(`🎉 बधाई हो! आपने 🪙 ${winAmount.toFixed(2)} (${currentMultiplier.toFixed(2)}x) जीते!`);
                updateUI();
            }
        }

        function showNotification(msg) {
            winNotif.innerText = msg;
