<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alok1xwin - Gaming Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }
        body {
            background-color: #121312;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .app-shell {
            width: 100%;
            max-width: 480px;
            background-color: #161816;
            min-height: 100vh;
            position: relative;
            padding-bottom: 80px;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
        }

        /* Top Header */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #1b1d1b;
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid #2a2d2a;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-icon {
            width: 34px;
            height: 34px;
            background: #f5d000;
            color: #121312;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 16px;
            box-shadow: 0 0 10px rgba(245, 208, 0, 0.4);
        }
        .wallet-pill {
            background: #252825;
            border: 1px solid #363a36;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 4px 4px 4px 10px;
            gap: 10px;
        }
        .wallet-amount {
            font-weight: bold;
            font-size: 14px;
            color: #ffffff;
        }
        .add-btn {
            background: #f5d000;
            color: #000;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .icon-btn {
            font-size: 18px;
            color: #b0b5b0;
            cursor: pointer;
            position: relative;
        }
        .vip-avatar {
            position: relative;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5d000, #ff8c00);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            border: 2px solid #f5d000;
        }
        .vip-tag {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #2b2e2b;
            color: #f5d000;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 4px;
            border: 1px solid #f5d000;
        }

        /* Top Winners Ticker */
        .winners-strip {
            display: flex;
            gap: 10px;
            padding: 12px 15px;
            overflow-x: auto;
            background: #141614;
        }
        .winners-strip::-webkit-scrollbar { display: none; }
        .winner-card {
            min-width: 95px;
            background: #202320;
            border-radius: 10px;
            padding: 6px;
            text-align: center;
            border: 1px solid #2e322e;
        }
        .winner-thumb {
            height: 55px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .winner-mult {
            color: #f5d000;
            font-size: 12px;
            font-weight: bold;
        }

        /* Quick Category Row */
        .cat-tabs {
            display: flex;
            justify-content: space-around;
            padding: 10px 15px;
            border-bottom: 1px solid #242724;
        }
        .cat-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #9fa59f;
            font-size: 12px;
            cursor: pointer;
        }
        .cat-tab.active {
            color: #f5d000;
        }
        .cat-tab span {
            font-size: 20px;
        }

        /* Section Title */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 15px 10px;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
        }
        .all-games-btn {
            background: #252825;
            color: #ccc;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            border: none;
            cursor: pointer;
        }

        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 15px;
        }
        .game-card {
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            height: 150px;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid #333833;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 12px;
        }
        .game-card:active {
            transform: scale(0.96);
        }
        .provider-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #e50914;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .provider-badge.blue { background: #2980b9; }
        .game-emoji {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 52px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
        }
        .game-name {
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            z-index: 2;
        }

        /* Card Themes */
        .bg-aviator { background: linear-gradient(160deg, #4a0e17 0%, #1a0508 100%); }
        .bg-dice { background: linear-gradient(160deg, #4b1d70 0%, #1d0b2e 100%); }
        .bg-gems { background: linear-gradient(160deg, #7d4e00 0%, #2b1a00 100%); }
        .bg-chicken { background: linear-gradient(160deg, #1b4f72 0%, #0b2233 100%); }

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            background: rgba(0,0,0,0.75);
            z-index: 100;
            display: none;
        }
        .side-drawer {
            position: fixed;
            top: 0;
            left: -280px;

            height: 100%;

            z-index: 101;

            padding: 15px 12px;
            overflow-y: auto;
            border-right: 1px solid #2e322e;
        }
        .side-drawer.open {

        .menu-item {
            background: #242724;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #e0e4e0;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .menu-item.active {
            background: #2f3328;
            border: 1px solid #f5d000;
            color: #f5d000;
        }
        .menu-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .hot-tag {
            background: #3a3518;
            color: #f5d000;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .menu-group {
            background: #242724;
            border-radius: 12px;
            padding: 5px 0;
            margin-top: 12px;
        }
        .menu-sub-item {
            padding: 11px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #cfd4cf;
            font-size: 14px;
            cursor: pointer;
        }
        .gold-text { color: #f5d000; font-weight: bold; }

            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0;
            z-index: 60;
